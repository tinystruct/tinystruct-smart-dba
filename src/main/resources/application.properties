# Sample application properties for generated tinystruct app
# Set tinystruct version that the generated project should use
tinystruct.version=1.7.27

#h2
driver=org.h2.Driver
database.url=jdbc:h2:~/test
database.user=
database.password=
database.connections.max=10

default.import.applications = org.tinystruct.system.HttpServer;org.tinystruct.app.SmartDBA
default.server.open_browser=false

#mcp
mcp.server.url = http://localhost:8080/
mcp.auth.token = 123456

#agent
agent.api_key=$_GEMINI_API_KEY
agent.api_url=
agent.skill_file=.agent/skills/tinystruct-patterns/SKILL.md

logging.enabled=FALSE