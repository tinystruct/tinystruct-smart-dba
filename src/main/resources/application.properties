# Sample application properties for generated tinystruct app
# Set tinystruct version that the generated project should use
tinystruct.version=1.7.35

#h2
driver=org.h2.Driver
database.url=jdbc:h2:~/test
database.user=
database.password=
database.connections.max=10

default.import.applications = org.tinystruct.system.HttpServer;org.tinystruct.app.SmartDBA
default.server.open_browser=false

#mcp
mcp.server.url = http://localhost:8080/
mcp.auth.token = 123456

#agent
agent.api_key=$_GEMINI_API_KEY
agent.api_url=
agent.model=gemini-3.5-flash-lite
agent.skill_file=.agent/skills/tinystruct-patterns/SKILL.md

logging.enabled=FALSE

# =============================================================================
# TypeSafe / JEV configuration
# =============================================================================
# API key: set TYPESAFE_API_KEY env var, or replace $_TYPESAFE_API_KEY below.
typesafe.api-key=$_TYPESAFE_API_KEY
typesafe.endpoint=https://api.typesafe.ai/v1/systemone
# Pin the model — jev-latest moves when TypeSafe ships new versions.
typesafe.model=jev-1.13.0

# Actions that ALWAYS require explicit user approval before execution.
# db/execute is intentionally excluded here — it is evaluated semantically
# by JEV (noul question) based on the actual SQL content.
typesafe.routing.allowed-actions=db/list-tables,db/describe,db/query,db/insert,db/update,db/delete,db/execute
typesafe.routing.confirm-actions=db/insert,db/update,db/delete

# Confidence thresholds (used when DispatchPipeline routes natural-language input).
typesafe.routing.min-confidence=0.80
typesafe.routing.auto-confidence=0.90
typesafe.routing.set-threshold=0.5
typesafe.routing.strategy=single

# Classification result cache (avoids duplicate JEV calls for identical inputs).
typesafe.cache.provider=memory
typesafe.cache.ttl=3600

# Confirmation workflow (WorkflowConfirmationService for HTTP/durable).
typesafe.confirmation.service=org.tinystruct.typesafe.workflow.WorkflowConfirmationService
typesafe.routing.confirmation-timeout-seconds=300
typesafe.workflow.repository=file
typesafe.workflow.snapshot-dir=workflow-snapshots/
typesafe.workflow.keep-completed=false

# Do not log argument values (they may contain sensitive data).
typesafe.logging.log-arguments=false