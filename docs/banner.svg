<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">SmartDBA</title>
  <desc id="d">SmartDBA: an AI database agent. Ask your database in plain English.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#15213b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cyl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="18" fill="url(#grid)"/>

  <!-- database icon -->
  <g transform="translate(72 78)">
    <path d="M0 22V138C0 160 40 176 88 176S176 160 176 138V22" fill="url(#cyl)" opacity="0.95"/>
    <ellipse cx="88" cy="22" rx="88" ry="26" fill="#7dd3fc"/>
    <path d="M0 62C0 84 40 100 88 100S176 84 176 62" fill="none" stroke="#0b1220" stroke-opacity="0.55" stroke-width="5"/>
    <path d="M0 102C0 124 40 140 88 140S176 124 176 102" fill="none" stroke="#0b1220" stroke-opacity="0.55" stroke-width="5"/>
    <!-- sparkle -->
    <path d="M168 -6l7 18 18 7-18 7-7 18-7-18-18-7 18-7z" fill="#fde68a"/>
    <path d="M198 40l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#fde68a" opacity="0.8"/>
  </g>

  <!-- title block -->
  <text x="290" y="150" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="78" font-weight="800" fill="#f8fafc" letter-spacing="-1">Smart<tspan fill="url(#accent)">DBA</tspan></text>
  <text x="292" y="196" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#cbd5e1">Ask your database in plain English.</text>
  <text x="292" y="240" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#94a3b8">AI agent  ·  MCP tools  ·  approval before writes</text>
  <rect x="292" y="262" width="120" height="4" rx="2" fill="url(#accent)"/>

  <!-- terminal card -->
  <g transform="translate(812 52)">
    <rect width="396" height="216" rx="12" fill="#0a0f1c" stroke="#334155"/>
    <circle cx="22" cy="20" r="6" fill="#f87171"/>
    <circle cx="42" cy="20" r="6" fill="#fbbf24"/>
    <circle cx="62" cy="20" r="6" fill="#34d399"/>
    <line x1="0" y1="40" x2="396" y2="40" stroke="#1e293b"/>
    <g font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="16">
      <text x="20" y="72" fill="#38bdf8">You &gt;</text>
      <text x="76" y="72" fill="#e2e8f0">top 3 customers by revenue</text>
      <text x="20" y="102" fill="#34d399">Agent &gt;</text>
      <text x="104" y="102" fill="#94a3b8">db/execute</text>
    </g>
    <!-- result table drawn with shapes so columns always align -->
    <g stroke="#22d3ee" stroke-width="1.2" fill="none">
      <rect x="20" y="120" width="260" height="78" rx="4"/>
      <line x1="20" y1="144" x2="280" y2="144"/>
      <line x1="150" y1="120" x2="150" y2="198"/>
    </g>
    <g font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="15">
      <text x="32" y="137" fill="#f8fafc" font-weight="700">customer</text>
      <text x="162" y="137" fill="#f8fafc" font-weight="700">revenue</text>
      <text x="32" y="164" fill="#e2e8f0">Acme</text>
      <text x="162" y="164" fill="#fde68a">128,400</text>
      <text x="32" y="188" fill="#e2e8f0">Globex</text>
      <text x="162" y="188" fill="#fde68a">97,250</text>
    </g>
  </g>
</svg>
